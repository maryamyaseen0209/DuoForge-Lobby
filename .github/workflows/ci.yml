name: Java CI

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Run engine tests
        run: ./scripts/test.sh
      - name: Build executable JAR
        run: ./scripts/build.sh
